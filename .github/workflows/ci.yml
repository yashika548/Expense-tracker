name: Expense Tracker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Check backend syntax
        working-directory: server
        run: node --check server.js

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build


      - name: Create CI environment files
        run: |
          echo "POSTGRES_DB=expense_tracker" > .env
          echo "POSTGRES_USER=expense_user" >> .env
          echo "POSTGRES_PASSWORD=ci_test_password" >> .env

          echo "POSTGRES_HOST=postgres" > server/.env
          echo "POSTGRES_PORT=5432" >> server/.env
          echo "POSTGRES_DB=expense_tracker" >> server/.env
          echo "POSTGRES_USER=expense_user" >> server/.env
          echo "POSTGRES_PASSWORD=ci_test_password" >> server/.env
          echo "REDIS_HOST=redis" >> server/.env
          echo "REDIS_PORT=6379" >> server/.env


      - name: Validate Docker Compose
        run: docker compose config

      - name: Build backend Docker image
        run: docker build -t expense-tracker-backend ./server

      - name: Build frontend Docker image
        run: docker build -t expense-tracker-frontend ./client